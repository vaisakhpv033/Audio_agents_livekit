<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ira.ai Voice Agent Reports{% endblock %}</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>
<body>
    <header class="app-header">
        <div class="container header-container">
            <div class="logo-area">
                <a href="/" class="logo-link">
                    <span class="logo-icon"><i class="fa-solid fa-microphone-lines"></i></span>
                    <span class="logo-text">Ira.ai <span class="logo-badge">Voice Agent Analytics</span></span>
                </a>
            </div>
            <nav class="header-nav">
                <a href="/" class="nav-btn {% if request.url.path == '/' %}active{% endif %}">
                    <i class="fa-solid fa-chart-line"></i> Dashboard
                </a>
            </nav>
        </div>
    </header>

    <main class="app-main">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="app-footer">
        <div class="container footer-container">
            <p>&copy; 2026 Ira.ai. Voice Evaluation and Quality Analytics Portal.</p>
            <p class="footer-powered">Powered by LiveKit Agents & Advanced LLM Evaluation</p>
        </div>
    </footer>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            window.formatLocalTime = (utcStr) => {
                if (!utcStr || utcStr === 'None' || utcStr === 'N/A') return 'N/A';
                try {
                    // Normalize to ensure UTC parsing
                    let formattedStr = utcStr;
                    if (!utcStr.endsWith('Z') && !utcStr.includes('+') && !/[-+]\d{2}:?\d{2}$/.test(utcStr)) {
                        formattedStr = utcStr + 'Z';
                    }
                    const date = new Date(formattedStr);
                    if (isNaN(date.getTime())) return utcStr;
                    
                    const options = {
                        month: 'short',
                        day: 'numeric',
                        year: 'numeric',
                        hour: 'numeric',
                        minute: '2-digit',
                        hour12: true
                    };
                    return new Intl.DateTimeFormat(navigator.language || 'en-US', options).format(date);
                } catch (e) {
                    console.error("Error formatting local time:", e);
                    return utcStr;
                }
            };

            document.querySelectorAll('.local-datetime').forEach(el => {
                const utcStr = el.getAttribute('data-utc');
                if (utcStr) {
                    el.textContent = window.formatLocalTime(utcStr);
                }
            });
        });
    </script>
</body>
</html>
