server {
    listen 80;
    server_name customeragent.vaisakhpv.space;

    # Maximum file upload size
    client_max_body_size 20M;

    # Access and error logs
    access_log /var/log/nginx/customeragent_access.log;
    error_log /var/log/nginx/customeragent_error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (in case the server uses websockets now or in the future)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
